<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

<title>A4 Product Poster</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap"
    rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(215,25,32,.18),
            transparent 30%
        ),
        #090a0d;

    font-family:
        Inter,
        Arial,
        sans-serif;
}


/* =========================================================
   APP
========================================================= */

.app{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;
}


/* =========================================================
   A4 POSTER

   EXACT A4 RATIO
   210 : 297
========================================================= */

.poster{

    position:relative;

    width:794px;

    height:1123px;

    max-width:100%;

    overflow:hidden;

    background:#f4f2ec;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);

}


/* =========================================================
   TOP HEADER
========================================================= */

.topbar{

    position:relative;

    width:100%;

    height:135px;

    padding:
        25px 32px;

    background:#111216;

    color:#fff;

    display:flex;

    justify-content:space-between;

    align-items:center;

    z-index:50;
}

.topbar::after{

    content:"";

    position:absolute;

    left:0;

    bottom:0;

    width:48%;

    height:6px;

    background:#d71920;
}


/* =========================================================
   LOGO
========================================================= */

.logo-box{

    width:220px;

    height:80px;

    padding:10px;

    border-radius:12px;

    background:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.logo-box img{

    display:block;

    max-width:100%;

    max-height:90px;

    width:auto;

    height:auto;

    object-fit:contain;
}


.brand-copy{

    text-align:right;
}

.brand-copy small{

    display:block;

    color:#999;

    font-size:10px;

    font-weight:800;

    letter-spacing:3px;

    margin-bottom:8px;
}

.brand-copy strong{

    font-family:Montserrat,Arial,sans-serif;

    font-size:31px;

    font-weight:900;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    height:713px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #d71920 0%,
            #d71920 24%,
            #e9e7e1 24.1%,
            #f7f6f2 100%
        );
}

.hero-word{

    position:absolute;

    left:-30px;

    bottom:-100px;

    font-family:Montserrat,Arial,sans-serif;

    font-size:300px;

    font-weight:900;

    line-height:1;

    color:
        rgba(255,255,255,.12);

    letter-spacing:-25px;
}

.hero-side{

    position:absolute;

    left:20px;

    top:190px;

    writing-mode:vertical-rl;

    transform:rotate(180deg);

    color:#fff;

    font-size:10px;

    font-weight:900;

    letter-spacing:4px;

    z-index:5;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{

    position:absolute;

    left:55px;

    right:30px;

    top:28px;

    bottom:22px;

    border-radius:35px;

    background:
        radial-gradient(
            circle at 50% 40%,
            #ffffff 0%,
            #faf9f6 55%,
            #e6e4dd 100%
        );

    box-shadow:
        0 30px 65px rgba(0,0,0,.18);

    overflow:hidden;

    z-index:3;
}


/* =========================================================
   MAIN PRODUCT IMAGE

   IMPORTANT:
   CONTAIN = NEVER STRETCH
========================================================= */

.product-image{

    position:absolute;

    left:50%;

    top:42%;

    transform:
        translate(-50%,-50%);

    width:92%;

    height:535px;

    object-fit:contain;

    object-position:center;

    /*
       DO NOT USE:
       object-fit:cover
    */

    z-index:5;

    filter:
        drop-shadow(
            0 35px 25px
            rgba(0,0,0,.25)
        );
}


/* =========================================================
   PLACEHOLDER
========================================================= */

.placeholder{

    position:absolute;

    left:50%;

    top:42%;

    transform:
        translate(-50%,-50%);

    width:360px;

    height:430px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #dededc,
            #f7f7f5,
            #d0d0ce
        );
}


/* =========================================================
   PREMIUM TAG
========================================================= */

.premium-tag{

    position:absolute;

    left:25px;

    top:25px;

    z-index:20;

    background:#111216;

    color:#fff;

    padding:
        13px 18px;

    border-radius:8px;

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;
}


/* =========================================================
   DISCOUNT
========================================================= */

.discount{

    position:absolute;

    right:25px;

    top:25px;

    width:105px;

    height:105px;

    border-radius:50%;

    background:#d71920;

    color:#fff;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:20;

    box-shadow:
        0 15px 35px
        rgba(215,25,32,.30);

    transform:rotate(7deg);
}

.discount span{

    font-size:10px;

    font-weight:900;

    letter-spacing:1px;
}

.discount strong{

    font-family:Montserrat,Arial,sans-serif;

    font-size:32px;

    line-height:1;
}


/* =========================================================
   THUMBNAILS

   ALWAYS BELOW MAIN IMAGE
========================================================= */

.thumbnail-area{

    position:absolute;

    left:20px;

    right:20px;

    bottom:18px;

    height:105px;

    padding:10px;

    background:
        rgba(255,255,255,.98);

    border-radius:16px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.15);

    z-index:30;
}

.thumbnail-list{

    width:100%;

    height:100%;

    display:grid;

    grid-template-columns:
        repeat(
            var(--thumb-count,1),
            minmax(0,1fr)
        );

    gap:10px;

    overflow:hidden;
}

.thumbnail{

    min-width:0;

    width:100%;

    height:100%;

    padding:3px;

    border:
        3px solid
        #e1e1e1;

    border-radius:10px;

    background:#fff;

    cursor:pointer;

    overflow:hidden;
}

.thumbnail.active{

    border-color:#d71920;

    box-shadow:
        0 0 0 1px #d71920;
}

.thumbnail img{

    width:100%;

    height:100%;

    display:block;

    /*
       IMPORTANT:
       THUMBNAILS ALSO NEVER STRETCH
    */

    object-fit:contain;

    object-position:center;

    background:#fafafa;
}


/* =========================================================
   EMPTY THUMBNAILS
========================================================= */

.empty-thumbs{

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#999;

    font-size:10px;

    font-weight:900;

    letter-spacing:1px;

    background:#f7f7f7;

    border-radius:8px;
}


/* =========================================================
   PRODUCT INFORMATION
========================================================= */

.info{

    height:215px;

    padding:
        25px 32px 20px;

    background:#fff;

    display:flex;

    flex-direction:column;

    justify-content:space-between;
}

.info-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.kicker{

    color:#999;

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;

    margin-bottom:6px;
}

.item-number{

    font-family:Montserrat,Arial,sans-serif;

    font-size:27px;

    font-weight:900;
}

.size-pill{

    display:inline-block;

    margin-top:10px;

    padding:
        8px 12px;

    border-left:
        4px solid
        #d71920;

    border-radius:5px;

    background:#f0efeb;

    font-size:10px;

    font-weight:900;
}

.price{

    text-align:right;
}

.old-price{

    color:#999;

    font-size:15px;

    text-decoration:line-through;
}

.offer-price{

    font-family:Montserrat,Arial,sans-serif;

    font-size:54px;

    font-weight:900;

    line-height:.95;

    letter-spacing:-3px;
}

.currency{

    font-size:15px;

    letter-spacing:1px;
}

.saving{

    margin-top:7px;

    color:#d71920;

    font-size:10px;

    font-weight:900;

    letter-spacing:1px;
}


/* =========================================================
   FEATURES
========================================================= */

.feature-strip{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;
}

.feature{

    padding:10px;

    text-align:center;

    background:#f5f4f0;

    border-radius:7px;

    color:#666;

    font-size:9px;

    font-weight:900;

    letter-spacing:.5px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    height:60px;

    background:#111216;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:10px;

    font-weight:900;

    letter-spacing:3px;
}


/* =========================================================
   EDIT BUTTON
========================================================= */

.edit-button{

    position:fixed;

    top:20px;

    left:20px;

    z-index:999;

    padding:
        13px 18px;

    border:0;

    border-radius:9px;

    background:#d71920;

    color:#fff;

    font-size:10px;

    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   RESPONSIVE PREVIEW

   IMPORTANT:
   Actual poster remains A4.
========================================================= */

@media(max-width:850px){

    .app{

        padding:
            75px 10px 20px;
    }

    .poster{

        width:
            min(
                794px,
                calc(100vw - 20px)
            );

        /*
           A4 ratio maintained
        */

        height:
            calc(
                min(
                    794px,
                    calc(100vw - 20px)
                ) * 1.4142857
            );
    }

    .topbar{

        height:12%;

        padding:3% 4%;
    }

    .logo-box{

        width:28%;

        height:65%;
    }

    .brand-copy strong{

        font-size:
            clamp(
                10px,
                3vw,
                31px
            );
    }

    .brand-copy small{

        font-size:
            clamp(
                5px,
                1.2vw,
                10px
            );
    }

    .hero{

        height:63.5%;
    }

    .product-card{

        left:7%;

        right:4%;

        top:4%;

        bottom:3%;
    }

    .product-image{

        width:92%;

        height:76%;
    }

    .thumbnail-area{

        height:14%;

        left:3%;

        right:3%;

        bottom:2%;
    }

    .info{

        height:19.1%;

        padding:
            3% 4%;
    }

    .offer-price{

        font-size:
            clamp(
                25px,
                6vw,
                54px
            );
    }

    .item-number{

        font-size:
            clamp(
                13px,
                3vw,
                27px
            );
    }

    .footer{

        height:5.35%;

        font-size:
            clamp(
                5px,
                1.5vw,
                10px
            );
    }
}

</style>

<body>


<!-- =====================================================
     EDIT BUTTON
===================================================== -->

<button
    class="edit-button"
    onclick="openEditor()">

</button>


<!-- =====================================================
     A4 POSTER
===================================================== -->

<div class="app">

<div
    class="poster"
    id="poster">


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="topbar">

        <div class="logo-box">

            <!--
                CHANGE logo.png TO YOUR LOGO
            -->

            <img
                src="assets/IT.jpeg"
                alt="Logo">

            </small>

            </strong>

        </div>

    </div>


    <!-- =================================================
         HERO
    ================================================== -->

    <div class="hero">

        <div class="hero-word">
            IT
        </div>

        <div class="hero-side">
            TRAVEL • STYLE • COMFORT
        </div>


        <div class="product-card">

                PREMIUM PRODUCT
            </div>

                </span>

                <strong id="savingCircle">
                    70
                </strong>

                    DHS
                </span>

            <!--
                IMPORTANT:
                Product image always uses CONTAIN
                so it cannot stretch.
            -->

                id="mainImage"
                class="product-image"
                src=""
                alt="Product"
                style="display:none;">


            <div
                class="placeholder"
                id="placeholder">
            </div>


            <!-- =========================================
                 THUMBNAILS
            ========================================== -->

            <div class="thumbnail-area">

                <div
                    class="thumbnail-list"
                    id="thumbnailList">

    <div class="info">

        <div class="info-top">

                <div class="kicker">

                    class="item-number"

                    15-288-08

                </div>

                    class="size-pill"
                    id="sizeText">

                    ONLY CABINE SIZE 21"

                </div>

            </div>


            <div class="price">

                <div
                    class="old-price"
                    id="oldPrice">

                    165 DHS

                </div>

                <div class="offer-price">

                    <span class="currency">
                        AED
                    </span>

                    <span id="newPrice">
                        95
                    </span>

                </div>

                <div class="saving">

                    SAVE
                    <span id="saving">
                        70
                    </span>
                    DHS

                </div>

        </div>


        <div class="feature-strip">

            <div class="feature">
                PREMIUM QUALITY
            </div>

            </div>

    </div>


    <!-- =================================================

    <div class="footer">

        LIMITED TIME OFFER • WHILE STOCK LASTS

    </div>


</div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

let images = [];

let activeImage = 0;


/* =========================================================
   UPLOAD INPUT
========================================================= */

function createUpload(){

    const input =
        document.createElement("input");

    input.type =
        "file";

    input.accept =
        "image/*";

    input.multiple =
        true;

    input.style.display =
        "none";


    input.onchange =
        function(){

            const files =
                Array.from(
                    input.files
                );

            loadImages(files);

        };


    document.body.appendChild(input);

    input.click();
}


/* =========================================================
   LOAD IMAGES
========================================================= */

function loadImages(files){

    const valid =
        files.filter(
            file =>
                file.type.startsWith(
                    "image/"
                )
        );


    if(!valid.length){

        return;
    }


    const promises =
        valid.map(
            file =>
                new Promise(
                    resolve => {

                        const reader =
                            new FileReader();


                        reader.onload =
                            e => {

                                resolve(
                                    e.target.result
                                );

                            };


                        reader.readAsDataURL(
                            file
                        );

                    }
                )
        );


    Promise.all(promises)
    .then(
        result => {

            images =
                images.concat(
                    result
                );


            if(images.length){

                activeImage =
                    Math.min(
                        activeImage,
                        images.length - 1
                    );

                showImage(
                    activeImage
                );

            }

        }
    );
}


/* =========================================================
   SHOW IMAGE
========================================================= */

function showImage(index){

    if(!images[index]){

        return;
    }


    activeImage =
        index;


    const main =
        document.getElementById(
            "mainImage"
        );


    const placeholder =
        document.getElementById(
            "placeholder"
        );


    main.src =
        images[index];


    main.style.display =
        "block";


    placeholder.style.display =
        "none";


    renderThumbnails();
}


/* =========================================================
   THUMBNAILS
========================================================= */

function renderThumbnails(){

    const list =
        document.getElementById(
            "thumbnailList"
        );


    list.innerHTML =
        "";


    if(!images.length){

        list.innerHTML = `
            <div class="empty-thumbs">
                UPLOAD PRODUCT IMAGES
            </div>
        `;

        list.style.setProperty(
            "--thumb-count",
            1
        );

        return;
    }


    /*
       AUTOMATIC WIDTH
    */

    list.style.setProperty(
        "--thumb-count",
        images.length
    );


    images.forEach(
        (src,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "thumbnail";


            if(index === activeImage){

                button.classList.add(
                    "active"
                );

            }


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                src;


            image.alt =
                "Product image " +
                (index + 1);


            button.appendChild(
                image
            );


            button.onclick =
                () => {

                    showImage(
                        index
                    );

                };


            list.appendChild(
                button
            );

        }
    );
}


/* =========================================================
   EDITOR
========================================================= */

function openEditor(){

    const choice =
        confirm(
            "OK = Upload Product Images\n\nCancel = Close"
        );


    if(choice){

        createUpload();

    }

}


/* =========================================================
   TEXT EDIT
========================================================= */

document.addEventListener(
    "dblclick",
    function(event){

        const target =
            event.target;


        if(
            target.id ===
            "itemNumber"
        ){

            const value =
                prompt(
                    "Enter Item Number:",
                    target.textContent.trim()
                );


            if(value !== null){

                target.textContent =
                    value;

            }

        }


        if(
            target.id ===
            "sizeText"
        ){

            const value =
                prompt(
                    "Enter Size:",
                    target.textContent.trim()
                );


            if(value !== null){

                target.textContent =
                    value;

            }

        }

    }
);


/* =========================================================
   PRICE EDIT
========================================================= */

document.addEventListener(
    "dblclick",
    function(event){

        if(
            event.target.id !==
            "newPrice"
        ){

            return;
        }


        const oldValue =
            parseFloat(
                document
                .getElementById("newPrice")
                .textContent
            ) || 0;


        const value =
            prompt(
                "Enter New Price:",
                oldValue
            );


        if(value === null){

            return;
        }


        const newPrice =
            parseFloat(value) || 0;


        document
            .getElementById("newPrice")
            .textContent =
            newPrice;


        calculateSaving();

    }
);


/* =========================================================
   OLD PRICE
========================================================= */

document.addEventListener(
    "dblclick",
    function(event){

        if(
            event.target.id !==
            "oldPrice"
        ){

            return;
        }


        const current =
            parseFloat(
                event.target.textContent
            ) || 0;


        const value =
            prompt(
                "Enter Old Price:",
                current
            );


        if(value === null){

            return;
        }


        event.target.textContent =
            value + " DHS";


        calculateSaving();

    }
);


/* =========================================================
   SAVING
========================================================= */

function calculateSaving(){

    const oldPrice =
        parseFloat(
            document
            .getElementById("oldPrice")
            .textContent
        ) || 0;


    const newPrice =
        parseFloat(
            document
            .getElementById("newPrice")
            .textContent
        ) || 0;


    const saving =
        Math.max(
            0,
            oldPrice - newPrice
        );


    document
        .getElementById("saving")
        .textContent =
        saving;


    document
        .getElementById("savingCircle")
        .textContent =
        saving;
}


/* =========================================================
   WAIT FOR IMAGES
========================================================= */

function waitForImages(){

    const allImages =
        Array.from(
            document.querySelectorAll(
                "#poster img"
            )
        );


    return Promise.all(

        allImages.map(
            image =>
                new Promise(
                    resolve => {

                        if(
                            image.complete
                        ){

                            resolve();

                        }else{

                            image.onload =
                                resolve;

                            image.onerror =
                                resolve;

                        }

                    }
                )
        )

    );

}


/* =========================================================
   EXPORT CANVAS

   IMPORTANT:

   The poster itself is EXACT A4 ratio.

   Therefore canvas also remains
   EXACT A4 ratio.

   No stretching.
========================================================= */

async function createExportCanvas(){

    await waitForImages();


    const poster =
        document.getElementById(
            "poster"
        );


    return await html2canvas(
        poster,
        {

            /*
               3X QUALITY
            */

            scale:3,

            useCORS:true,

            allowTaint:false,

            backgroundColor:
                "#f4f2ec",

            /*
               CRITICAL
               DO NOT manually change
               width/height ratio.
            */

            width:
                poster.offsetWidth,

            height:
                poster.offsetHeight,

            scrollX:0,

            scrollY:0,

            logging:false

        }
    );

}


/* =========================================================
   DOWNLOAD PNG

   EXACT A4 RATIO
========================================================= */

async function downloadPNG(){

    try{

        const canvas =
            await createExportCanvas();


        /*
           Create a fresh A4 canvas.

           A4 ratio:
           210 / 297
        */

        const A4_WIDTH =
            2480;

        const A4_HEIGHT =
            3508;


        const output =
            document.createElement(
                "canvas"
            );


        output.width =
            A4_WIDTH;

        output.height =
            A4_HEIGHT;


        const ctx =
            output.getContext(
                "2d"
            );


        /*
           Never stretch.

           Draw poster proportionally.
        */

        ctx.drawImage(

            canvas,

            0,

            0,

            A4_WIDTH,

            A4_HEIGHT

        );


        const link =
            document.createElement(
                "a"
            );


        link.download =
            "A4-Product-Poster.png";


        link.href =
            output.toDataURL(
                "image/png"
            );


        link.click();


    }catch(error){

        console.error(error);

        alert(
            "PNG export failed."
        );

    }

}


/* =========================================================
   DOWNLOAD A4 PDF

   EXACT:
   210mm × 297mm

   POSTER FILLS WHOLE PAGE
========================================================= */

async function downloadPDF(){

    try{

        const canvas =
            await createExportCanvas();


        const image =
            canvas.toDataURL(
                "image/jpeg",
                1
            );


        const {
            jsPDF
        } =
            window.jspdf;


        /*
           EXACT A4
        */

        const pdf =
            new jsPDF({

                orientation:
                    "portrait",

                unit:
                    "mm",

                format:
                    [210,297],

                compress:
                    true
            });


        /*
           EXACT PAGE SIZE
        */

        pdf.addImage(

            image,

            "JPEG",

            0,

            0,

            210,

            297,

            undefined,

            "FAST"

        );


        pdf.save(
            "A4-Product-Poster.pdf"
        );


    }catch(error){

        console.error(error);

        alert(
            "PDF export failed."
        );

    }

}


/* =========================================================
   DOWNLOAD BUTTONS

   Ctrl + Shift + P = PNG
   Ctrl + Shift + D = PDF
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "p"
        ){

            event.preventDefault();

            downloadPNG();

        }


        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "d"
        ){

            event.preventDefault();

            downloadPDF();

        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

calculateSaving();

renderThumbnails();
